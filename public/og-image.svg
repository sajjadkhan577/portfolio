<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0e17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e599" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0e17" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#1e293b" stroke-width="2" />
  <rect x="26" y="26" width="1148" height="578" rx="26" fill="none" stroke="#00e599" stroke-width="1" stroke-opacity="0.2" />

  <!-- Top Navigation Bar mockup -->
  <g transform="translate(70, 70)">
    <rect width="52" height="52" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="26" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#00e599" text-anchor="middle">SK</text>
    <text x="68" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Sajjad Khan</text>
    <text x="68" y="48" font-family="monospace" font-size="14" fill="#94a3b8">Full-Stack Web Developer • Peshawar &amp; Worldwide</text>

    <!-- Availability Badge -->
    <g transform="translate(780, 8)">
      <rect width="280" height="36" rx="18" fill="#111827" stroke="#00e599" stroke-width="1.5" stroke-opacity="0.4" />
      <circle cx="20" cy="18" r="5" fill="#00e599" />
      <text x="34" y="23" font-family="monospace" font-size="12" font-weight="600" fill="#00e599">AVAILABLE FOR CLIENT WORK</text>
    </g>
  </g>

  <!-- Main Headline -->
  <g transform="translate(70, 190)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#f8fafc" letter-spacing="-1.5">
      <tspan x="0" dy="0">I build high-performance platforms</tspan>
      <tspan x="0" dy="70">for </tspan>
      <tspan fill="url(#textGrad)">coaches, course creators</tspan>
      <tspan fill="#f8fafc"> &amp; businesses.</tspan>
    </text>

    <!-- Subheadline -->
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">
      Custom LMS with Student Portals • Automated Booking Funnels • 90+ Lighthouse Speed
    </text>
  </g>

  <!-- Bottom Technology Pills -->
  <g transform="translate(70, 480)">
    <g transform="translate(0, 0)">
      <rect width="90" height="42" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
      <text x="45" y="26" font-family="monospace" font-size="15" font-weight="700" fill="#00e599" text-anchor="middle">PHP</text>
    </g>
    <g transform="translate(105, 0)">
      <rect width="105" height="42" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
      <text x="52" y="26" font-family="monospace" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">MySQL</text>
    </g>
    <g transform="translate(225, 0)">
      <rect width="100" height="42" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
      <text x="50" y="26" font-family="monospace" font-size="15" font-weight="700" fill="#00e599" text-anchor="middle">React</text>
    </g>
    <g transform="translate(340, 0)">
      <rect width="115" height="42" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
      <text x="57" y="26" font-family="monospace" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Node.js</text>
    </g>
    <g transform="translate(470, 0)">
      <rect width="125" height="42" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
      <text x="62" y="26" font-family="monospace" font-size="15" font-weight="700" fill="#00e599" text-anchor="middle">MongoDB</text>
    </g>
    <g transform="translate(610, 0)">
      <rect width="150" height="42" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" />
      <text x="75" y="26" font-family="monospace" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Tailwind CSS</text>
    </g>

    <!-- Speed Metric Box -->
    <g transform="translate(850, -10)">
      <rect width="210" height="56" rx="16" fill="#111827" stroke="#00e599" stroke-width="1.5" />
      <text x="20" y="26" font-family="monospace" font-size="11" fill="#94a3b8">LIGHTHOUSE TARGET</text>
      <text x="20" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#00e599">90+ Performance</text>
      <circle cx="180" cy="28" r="14" fill="#00e599" fill-opacity="0.15" />
      <text x="180" y="33" font-family="monospace" font-size="13" font-weight="800" fill="#00e599" text-anchor="middle">⚡</text>
    </g>
  </g>
</svg>
